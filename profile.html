<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detective Profile</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body.profile-body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle, #0d0d0d, #1a0000);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .profile-container {
        text-align: center;
        padding: 2rem;
        max-width: 600px;
        width: 90%;
        border: 2px solid rgba(255, 0, 0, 0.3);
        border-radius: 15px;
        background: rgba(0, 0, 0, 0.5);
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
        position: relative;
      }

      .profile-container h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #ff4a4a;
      }

      .profile-card {
        font-size: 1.2rem;
        text-align: left;
        background: rgba(20, 20, 20, 0.8);
        border-radius: 10px;
        padding: 1.5rem;
        margin-bottom: 2rem;
        box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.1);
      }

      .profile-card p {
        margin: 0.5rem 0;
        color: #eee;
      }

      .btn {
        padding: 0.7rem 1.5rem;
        font-size: 1rem;
        background-color: #ff1a1a;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
      }

      .btn:hover {
        background-color: #cc0000;
        transform: scale(1.05);
      }

      .medal-icon {
        width: 60px;
        height: 100px;
        margin: 0 auto 1rem;
        animation: spin 6s linear infinite;
        opacity: 0.7;
      }

      @keyframes spin {
        0% {
          transform: rotateY(0deg);
        }
        100% {
          transform: rotateY(360deg);
        }
      }

      .medal-label {
        font-size: 1rem;
        font-style: italic;
        color: #ccc;
        margin-bottom: 50px;
      }

      #profile-container {
        position: relative;
        width: 90%;
        max-width: 500px;
        margin: 80px auto;
        padding: 30px;
        background: #111;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        color: #fff;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }

      #profile-container.fade-out {
        opacity: 0;
        transform: scale(0.9);
      }

      #close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        background: none;
        color: #ff4d4d;
        border: none;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        z-index: 999;
      }
      #close-btn:hover {
        color: white;
      }
    </style>
  </head>
  <button id="close-btn">✖</button>
  <body class="profile-body">
    <div class="profile-container">
      <h1>Detective Profile</h1>
      <img src="assets/medal.png" alt="Medal" class="medal-icon" />
      <div class="medal-label">Your Medals of Honor</div>
      <div class="profile-card">
        <p><strong>Name:</strong> <span id="detectiveName"></span></p>
        <p><strong>Cases Solved:</strong> <span id="solvedCases"></span></p>
        <p><strong>Medals:</strong> <span id="medalCount"></span></p>
      </div>
      <a href="case_selection.html" class="btn">View Available Cases</a>
    </div>

    <script>
      // Load user data from localStorage
      document.getElementById("detectiveName").textContent =
        localStorage.getItem("detectiveName") || "Unknown";
      document.getElementById("solvedCases").textContent =
        localStorage.getItem("solvedCases") || 0;
      document.getElementById("medalCount").textContent =
        localStorage.getItem("medalCount") || 0;

      document.getElementById("close-btn").addEventListener("click", () => {
        window.history.back(); // or use window.location.href = 'case_selection.html';
      });
    </script>
  </body>
</html>
